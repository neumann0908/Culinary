name: Compilar APK Culinary Studio

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Traer codigo del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Instalar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: 5. Compilar la APK
        run: gradle assembleDebug --no-daemon

      - name: 6. Subir APK lista para descargar
        uses: actions/upload-artifact@v4
        with:
          name: CulinaryStudio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
