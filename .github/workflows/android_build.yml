name: Compilar APK Culinary Studio

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Traer codigo del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Dar permisos a Gradle
        run: chmod +x gradlew

      - name: 4. Compilar la APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 5. Subir APK lista para descargar
        uses: actions/upload-artifact@v4
        with:
          name: CulinaryStudio-APK
          path: app/build/outputs/apk/debug/app-debug.apk
