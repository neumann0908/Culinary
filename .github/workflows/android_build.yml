name: Compilar APK Culinary Studio

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Traer codigo del repositorio[span_2](start_span)[span_2](end_span)
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17[span_3](start_span)[span_3](end_span)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Aceptar licencias de Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 4. Instalar Gradle[span_4](start_span)[span_4](end_span)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: 5. Compilar la APK[span_5](start_span)[span_5](end_span)
        run: gradle :app:assembleDebug -x test --stacktrace

      - name: 6. Subir APK lista para descargar[span_6](start_span)[span_6](end_span)
        uses: actions/upload-artifact@v4
        with:
          name: CulinaryStudio-APK[span_7](start_span)[span_7](end_span)
          path: app/build/outputs/apk/debug/app-debug.apk[span_8](start_span)[span_8](end_span)
          
